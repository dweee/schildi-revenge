# Regenerates one platform's pinned offline Gradle cache with the package's
# own mitmCache.updateScript. Manual only: this is a maintenance tool for the
# dependency locks that upstream bumps invalidate, not a check.
name: Relock Gradle dependency cache

on:
  workflow_dispatch:
    inputs:
      cache_only:
        description: Cache existing Nix updater tooling without running Gradle or changing locks
        type: boolean
        default: false
      system:
        description: Nix system whose deps-*.json should be regenerated
        required: true
        default: aarch64-darwin
        type: choice
        options:
          - aarch64-darwin
          - x86_64-linux
          - aarch64-linux

permissions:
  contents: read

jobs:
  relock:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.system == 'aarch64-darwin' && 'macos-15' || (inputs.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: 240
    outputs:
      cache_ready: ${{ steps.cache_transfer.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        if: ${{ !(runner.os == 'macOS' && runner.arch == 'X64') }}
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false

      - name: Select the dependency file
        run: |
          set -eu
          case "${{ inputs.system }}" in
            aarch64-darwin) echo 'DATA=deps-darwin.json' >> "$GITHUB_ENV" ;;
            x86_64-linux) echo 'DATA=deps-linux.json' >> "$GITHUB_ENV" ;;
            aarch64-linux) echo 'DATA=deps-linux-arm64.json' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported system' >&2; exit 1 ;;
          esac

      - name: Allow unprivileged user namespaces for bubblewrap
        if: ${{ runner.os == 'Linux' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure read-only Niks3 access on the default branch
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: python3 ci/configure-niks3.py --oidc

      - name: Regenerate the pinned cache
        env:
          CACHE_ONLY: ${{ inputs.cache_only && 'true' || 'false' }}
        run: |
          set -eu
          rm -f result
          target=".#packages.${{ inputs.system }}.default.mitmCache.updateScript"
          python3 ci/retain-build-outputs.py --target "$target" --manifest cache-outputs.txt -- \
            nix build --option accept-flake-config false --no-write-lock-file \
            --print-out-paths -o result "$target"
          if test "$CACHE_ONLY" != true; then
            env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL ./result
          fi
          test -s "$DATA"

      - name: Remove private reader before exporting build data
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup

      - name: Export completed public relock graph outputs
        id: cache_transfer
        if: ${{ always() && !cancelled() && hashFiles('cache-outputs.txt') != '' }}
        env:
          ATTIC_MAX_CLOSURE_MIB: ${{ vars.ATTIC_MAX_CLOSURE_MIB || '8192' }}
        run: python3 ci/transfer-attic.py export --directory relock-transfer --manifest cache-outputs.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !cancelled() && steps.cache_transfer.outcome == 'success' }}
        with:
          name: relock-${{ inputs.system }}-${{ github.sha }}
          path: relock-transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Save regenerated dependency metadata
        if: ${{ inputs.cache_only != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deps-${{ inputs.system }}
          path: ${{ env.DATA }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: relock
    if: ${{ always() && !cancelled() && needs.relock.outputs.cache_ready == 'success' && vars.NIKS3_PUSH_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: relock-${{ inputs.system }}-${{ github.sha }}
          path: relock-transfer
      - name: Read Niks3 before installing the pinned publisher
        run: python3 ci/configure-niks3.py --oidc
      - name: Install pinned Niks3 publisher
        run: bash ci/install-niks3.sh --retain-bootstrap
      - name: Publish completed bootstrap graph
        run: python3 ci/push-niks3.py --outputs niks3-bootstrap-outputs.txt
      - name: Import public data and publish with S3 integrity verification
        env:
          ATTIC_MAX_CLOSURE_MIB: ${{ vars.ATTIC_MAX_CLOSURE_MIB || '8192' }}
        run: |
          python3 ci/transfer-attic.py import --directory relock-transfer
          python3 ci/push-niks3.py --outputs relock-transfer/outputs.txt
      - name: Remove job-local Niks3 reader
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup
